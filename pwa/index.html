<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Test">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>PWA Test</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:system-ui,-apple-system,sans-serif;background:#111;color:#f5f5f5;display:grid;place-items:center;padding:24px}main{width:min(100%,420px)}h1{font-size:36px;margin:0 0 8px}p{color:#aaa;line-height:1.45}.card{border:1px solid #333;border-radius:20px;padding:20px;margin-top:24px;background:#181818}.count{font-size:64px;font-variant-numeric:tabular-nums;margin:12px 0}button{width:100%;font:inherit;font-weight:650;font-size:20px;padding:16px;border:0;border-radius:14px;background:#f5f5f5;color:#111}small{display:block;margin-top:14px;color:#777}
  </style>
</head>
<body>
<main>
  <h1>It works.</h1>
  <p>This page is a tiny installable iPhone web app. The counter persists locally and the app shell is cached for offline use.</p>
  <section class="card">
    <div>Local counter</div>
    <div class="count" id="count">0</div>
    <button id="add">+1</button>
    <small id="status">Checking…</small>
  </section>
</main>
<script>
  const key='pwa-test-count';
  let n=Number(localStorage.getItem(key)||0);
  const count=document.querySelector('#count');
  const status=document.querySelector('#status');
  const render=()=>count.textContent=n;
  document.querySelector('#add').onclick=()=>{n++;localStorage.setItem(key,n);render()};
  const net=()=>status.textContent=navigator.onLine?'Online · saved on this iPhone':'Offline · app still running';
  addEventListener('online',net);addEventListener('offline',net);render();net();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
